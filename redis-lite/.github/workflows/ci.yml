name: CI

# 为什么这个工作流是刚需而不是形式主义（本项目真实教训）：
#
#   1) 项目在 Windows 上开发，`platform.h` 用 #ifdef 分两个分支。
#      Windows 分支天天编译，Linux 分支**从未编译过** —— 直到交付前
#      传到 Linux 虚拟机才发现漏了 <netdb.h> 和 <sys/eventfd.h>，
#      6 个符号未声明。一个分支能过 ≠ 代码可移植。
#
#   2) 关闭路径（优雅退出）有一个跨线程操作事件循环的 bug：
#      正常压测完全正常，一收到 SIGTERM 就 abort。因为压测流量里连接
#      都是客户端先断开的，服务端主动关闭的路径从未被执行过。
#      直到在 ASan 下专门测优雅退出才暴露。
#
# 结论：多平台 + 多编译器 + sanitizer 的 CI 矩阵，每一项都对应一个
# 已经真实发生过的失败模式。

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------- 主构建矩阵
  build:
    strategy:
      fail-fast: false   # 一个编译器挂了，其余照常跑，便于一次性看全失败面
      matrix:
        compiler:
          - { cc: gcc, cxx: g++,   name: gcc-11 }   # 与开发虚拟机一致
          - { cc: gcc, cxx: g++,   name: gcc-13 }   # 更新编译器（提前暴露未来问题）
          - { cc: clang, cxx: clang++, name: clang-18 }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CC: ${{ matrix.compiler.cc }}-${{ matrix.compiler.name }}
          CXX: ${{ matrix.compiler.cxx }}-${{ matrix.compiler.name }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # 三个编译器都要 0 告警：告警往往是 bug 的前兆，
      # 本项目目前就是 -Wall -Wextra 零告警的水平，不许回退。
      - name: Build (warnings as errors)
        run: |
          cmake -B build-werror -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS="-Werror -Wall -Wextra"
          cmake --build build-werror -j"$(nproc)"
        env:
          CC: ${{ matrix.compiler.cc }}-${{ matrix.compiler.name }}
          CXX: ${{ matrix.compiler.cxx }}-${{ matrix.compiler.name }}

      - name: Unit tests
        run: ./build/bin/rl-tests

  # ---------------------------------------------------------- sanitizer
  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nc (shutdown test 需要)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq netcat-openbsd

      - name: Build with ASan + UBSan
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan -j"$(nproc)"
        env:
          CC: gcc-13
          CXX: g++-13

      - name: Unit tests under sanitizers
        run: ./build-asan/bin/rl-tests

      # ★ 关闭路径是单独一类测试，与单测分开：
      #   它验证「服务端主动关闭」这条压测覆盖不到的执行路径。
      #   本项目曾在这里藏过一个 abort 级 bug（详见 scripts/test_shutdown.sh 注释）。
      - name: Shutdown path under sanitizers
        run: bash scripts/test_shutdown.sh
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
