name: CI

# 注意：本文件必须在**仓库根目录**的 .github/workflows/ 下，
# 而不是 redis-lite/ 子目录里 —— GitHub Actions 只扫描根目录。
# （历史教训：工作流放在 redis-lite/.github/workflows/ 时，
#   GitHub 检测到 0 个工作流，推送后什么都不会发生。）

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------- 构建矩阵
  #
  # ⚠️ 编译器可用性取决于 runner 的镜像版本，不能照搬开发机。
  #    本项目踩过的坑：开发虚拟机是 Ubuntu 22.04（默认 gcc-11），
  #    于是矩阵里写了 gcc-11，但 runner 用 ubuntu-24.04（默认 gcc-13，
  #    没有 gcc-11），Configure 阶段 0 秒就失败。
  #
  #    修法不只是"换成存在的编译器"，而是把「不假设」固化下来：
  #    矩阵里为每个条目声明 pkg 名，下面的 Ensure 步骤检测不到就装。
  #    这样即使将来 runner 镜像变动，也不会再因为缺编译器而红。
  build:
    strategy:
      fail-fast: false   # 一个配置挂了其余照跑，便于一次看全失败面
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     pkg: g++-13,     label: gcc-13 }
          - { os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, pkg: clang-18,   label: clang-18 }
          - { os: ubuntu-22.04, cc: gcc-11,   cxx: g++-11,     pkg: g++-11,     label: "gcc-11 (legacy)" }
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.label }})
    defaults:
      run:
        working-directory: redis-lite
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ${{ matrix.cxx }} is available
        run: |
          if command -v "${{ matrix.cxx }}" > /dev/null 2>&1; then
            echo "${{ matrix.cxx }} already present"
          else
            echo "${{ matrix.cxx }} missing on this runner image -- installing"
            sudo apt-get update -qq
            sudo apt-get install -y "${{ matrix.pkg }}"
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ./build/bin/rl-tests

  # 零告警是当前基线（-Wall -Wextra 下 0 warning），-Werror 防止回退。
  # 历史教训：Linux 分支曾从未编译过，直到交付前才在虚拟机上发现
  # 缺 <netdb.h> / <sys/eventfd.h>。多编译器矩阵防的就是这类盲区。
  werror:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: redis-lite
    steps:
      - uses: actions/checkout@v4

      - name: Build with -Werror
        run: |
          cmake -B build-werror -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS="-Werror -Wall -Wextra"
          cmake --build build-werror -j"$(nproc)"
        env:
          CC: gcc-13
          CXX: g++-13

  # 关闭路径（服务端主动退出）曾是压测永远覆盖不到的盲区：
  # 正常流量下连接都是客户端先断开，优雅退出路径从未被执行，
  # 曾导致每次 SIGTERM 都 abort。这一步把它变成例行检查。
  sanitizer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: redis-lite
    steps:
      - uses: actions/checkout@v4

      - name: Install netcat (shutdown test 需要)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq netcat-openbsd

      # 复用 scripts/build.sh debug，而不是内联 cmake 命令。
      # 理由：内联写法要把 "-fsanitize=... -fno-omit-frame-pointer" 作为
      # 单个参数传给 CMAKE_CXX_FLAGS，对引号转义极其敏感 —— 一旦引号被
      # 某一层 shell 吃掉，cmake 会收到两个独立参数并直接报
      # "Unknown argument -fno-omit-frame-pointer"。
      # 放进脚本文件里由 bash 解析，配置只有一处、可本地复现。
      - name: Build with ASan + UBSan
        run: bash scripts/build.sh debug
        env:
          CC: gcc-13
          CXX: g++-13

      - name: Unit tests under sanitizers
        run: ./build-debug/bin/rl-tests

      - name: Shutdown path under sanitizers
        run: bash scripts/test_shutdown.sh ./build-debug/bin
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
